site_name: "> Homelab Documentation"
site_url: https://homelab.kcn333.com/
site_description: Personal homelab documentation covering infrastructure, provisioning, Kubernetes, automation, pentesting labs, and troubleshooting.
repo_url: https://github.com/kCn3333/homelab
repo_name: kCn3333/homelab
edit_uri: edit/main/docs/
docs_dir: docs

hooks:
  - hooks/nav_icons.py

theme:
  name: material
  language: en
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  
  features:
    - announce.dismiss
    #- content.action.edit
    #- content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    #- navigation.expand
    #- navigation.footer         
    #- navigation.indexes
    #- navigation.instant
    #- navigation.instant.prefetch
    #- navigation.instant.progress
    #- navigation.sections
    #- navigation.tabs
    #- navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    #- search.highlight
    #- search.share
    #- search.suggest
    - toc.follow

plugins:
  - awesome-pages
  - redirects:
      redirect_maps:
        "journal/day 00.md": journal/day-00.md
        "journal/day 01.md": journal/day-01.md
        "journal/day 02.md": journal/day-02.md
        "journal/day 03.md": journal/day-03.md
        "journal/day 04.md": journal/day-04.md
        "journal/day 05.md": journal/day-05.md
        "journal/day 06.md": journal/day-06.md
        "journal/day 07.md": journal/day-07.md
        "journal/day 08.md": journal/day-08.md
        "journal/day 09.md": journal/day-09.md
        "journal/day 10.md": journal/day-10.md
        "journal/day 11.md": journal/day-11.md
        "journal/day 12.md": journal/day-12.md
        "journal/day 13.md": journal/day-13.md
        "journal/day 14.md": journal/day-14.md
        "journal/day 15.md": journal/day-15.md
        "journal/day 16.md": journal/day-16.md
        "journal/day 17.md": journal/day-17.md
        "journal/day 18.md": journal/day-18.md
        "journal/day 19.md": journal/day-19.md
        "journal/day 20.md": journal/day-20.md
        "journal/day 21.md": journal/day-21.md
        "journal/day 22.md": journal/day-22.md
        "journal/day 23.md": journal/day-23.md
        "journal/day 24.md": journal/day-24.md
        "journal/day 25.md": journal/day-25.md
        "journal/day 26.md": journal/day-26.md
        "journal/day 27.md": journal/day-27.md
        "journal/day 28.md": journal/day-28.md
        "journal/day 29.md": journal/day-29.md
        "journal/day 30.md": journal/day-30.md
        "journal/day 31.md": journal/day-31.md
        "journal/day 32.md": journal/day-32.md
        "journal/day 33.md": journal/day-33.md
        "journal/day 34.md": journal/day-34.md
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  #- roamlinks
  - callouts
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  #- git-authors
      
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      #auto_title: true
      #pygments_style: one-dark 
      use_pygments: true   
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: kCn3333
      repo: homelab
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kCn3333
    - icon: fontawesome/brands/discord 
      link: https://discord.com/users/1314708812120330333
    - icon: fontawesome/solid/envelope
      link: mailto:kcn@kcn333.com
  generator: false

extra_css:
  - stylesheets/retro.css
  - stylesheets/code-blocks.css
  - stylesheets/admonitions.css

#extra_javascript:
 # - javascripts/matrix-homelab.js

copyright: |
  <div style="text-align: center; margin-top: 1rem;">
    <p style="color: #E0E0E0; font-style: italic; margin-bottom: 0.5rem;">
      Built with coffee, curiosity, and so much fun © kCn 2023-2026 ✌︎︎  
    </p>
  </div>